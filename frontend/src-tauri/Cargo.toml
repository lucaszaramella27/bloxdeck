[package]
name = "bloxdeck"
version = "0.1.0"
description = "A safe Roblox companion launcher"
authors = ["BloxDeck"]
edition = "2021"

[lib]
name = "bloxdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

